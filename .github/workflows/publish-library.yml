name: Publish remote library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keep deployments in order without interrupting an active publication.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema pillow
      - name: Validate source records and examples
        run: python tools/validate.py
      - name: Run conformance and generation tests
        run: python -m unittest discover -s tests -v
      - name: Rebuild the manifest and library from this commit
        run: python tools/build_api.py
      - name: Check generated output
        run: python tools/build_api.py --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the validated library
        id: deployment
        uses: actions/deploy-pages@v4
