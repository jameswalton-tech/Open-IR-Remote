name: Validate remote library

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install jsonschema pillow
      - run: python tools/validate.py
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_api.py
      - run: python tools/build_api.py --check
